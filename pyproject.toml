[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "botfriend"
version = "0.1.0"
description = "Real-time voice-to-code pipeline using Claude Code"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.85.0",
    "faster-whisper>=1.0.0",
    "pyannote.audio>=3.1",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
]

[project.scripts]
botfriend = "botfriend.main:main"
